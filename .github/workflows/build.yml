
name: Build PNG Asset Lab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package plugin ZIP
        run: |
          mkdir -p dist
          zip -j dist/png-asset-lab.zip \
            plugin.json main.js README.md

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: png-asset-lab
          path: dist/png-asset-lab.zip
          
